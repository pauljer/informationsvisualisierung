<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <title>Übung 11.3 – DAG mit drei Dagre-Rankern</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <style>
        body {
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="elm"></div>
    <script src="elm3.js"></script>
    <script>
        if (typeof dagre === "undefined") {
            document.getElementById("elm").innerHTML =
                '<p style="color:#a00;font-family:sans-serif;padding:20px">' +
                'Fehler: dagre.min.js konnte nicht geladen werden.</p>';
        } else {
            var app = Elm.Uebung11Aufgabe3.init({
                node: document.getElementById("elm")
            });

            // Elm sendet eine Liste von Graphen, JS layoutet jeden einzeln
            // und schickt die Ergebnisse als Liste zurück.
            app.ports.layout.subscribe(function (data) {
                var inputs = JSON.parse(data);
                var results = inputs.map(function (raw) {
                    var g = dagre.graphlib.json.read(raw);
                    dagre.layout(g);
                    return dagre.graphlib.json.write(g);
                });
                app.ports.graphs.send(results);
            });
        }
    </script>
</body>

</html>
