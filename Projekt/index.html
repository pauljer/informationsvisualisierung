<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projekt: EnergyCharts Visual Analytics</title>
    <style>
        :root {
            --bg-1: #f4efe3;
            --bg-2: #dfead8;
            --ink: #1f2a1f;
            --muted: #4e5b4e;
            --card: rgba(255, 255, 255, 0.72);
            --line: #6f8f5e;
            --accent: #b14d2a;
            --accent-2: #226f7a;
            --ok: #2f7a3e;
            --warn: #995d00;
            --error: #9b1d20;
            --shadow: rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 10%, rgba(177, 77, 42, 0.20), transparent 35%),
                radial-gradient(circle at 80% 15%, rgba(34, 111, 122, 0.16), transparent 32%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            min-height: 100vh;
            font-family: "Avenir Next", "Gill Sans", "Trebuchet MS", sans-serif;
            animation: fadeIn 480ms ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #elm {
            width: min(1200px, 94vw);
            margin: 24px auto 32px;
            padding: 18px;
            background: var(--card);
            border: 1px solid rgba(31, 42, 31, 0.14);
            border-radius: 16px;
            box-shadow: 0 16px 36px var(--shadow);
            backdrop-filter: blur(3px);
        }

        @media (max-width: 760px) {
            #elm {
                width: 96vw;
                margin: 12px auto 20px;
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <div id="elm"></div>
    <script src="elm.js"></script>
    <script>
        Elm.Main.init({ node: document.getElementById("elm") });
    </script>
</body>

</html>
